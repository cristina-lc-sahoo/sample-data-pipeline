name: Upload Data to S3 using Snowpipe and SQS

on:
  push:
    paths:
      - 'data/**'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Upload timestamped CSV for Snowpipe
      run: |
        aws s3 cp data/users.csv s3://cristina-data-pipeline-bucket-2026/data/snowpipe/users_$(date +%Y%m%d_%H%M%S).csv
