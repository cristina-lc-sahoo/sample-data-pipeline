name: Sync CSV to Azure Storage

on:
  push:
    branches:
      - main
    paths:
      - 'data/users.csv'
  workflow_dispatch:

jobs:
  upload-to-azure:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Upload CSV using Native Azure Action
      uses: azure/upload-file@v1
      with:
        connection-string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        container-name: 'github-landing-zone'
        file-path: 'data/users.csv'
        blob-name: 'users.csv'
