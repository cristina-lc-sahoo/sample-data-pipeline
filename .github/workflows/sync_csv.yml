name: Sync CSV to Azure Storage

on:
  push:
    branches:
      - main
    paths:
      - 'data/users.csv'
  workflow_dispatch:

jobs:
  upload-to-azure:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Upload CSV via Environment Variable
      uses: azure/CLI@v2
      env:
        AZURE_CONN: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      with:
        azcliversion: latest
        inlineScript: |
          az storage blob upload \
            --connection-string "$AZURE_CONN" \
            --container-name "github-landing-zone" \
            --file "data/users.csv" \
            --name "users.csv" \
            --overwrite true
      
    - name: Load CSV into Azure SQL
      uses: azure/sql-action@v2.3
      with:
        connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        path: ./sql/load_users.sql
